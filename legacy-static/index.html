<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Prep Studio</title>
  <meta name="description" content="Complete IELTS preparation: question types, strategies, practice tests, vocabulary, grammar and speaking simulator.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232563eb'/><text x='32' y='43' font-size='30' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>IE</text></svg>">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
    <a href="#/" class="brand"><span class="logo">IE</span> IELTS Prep Studio</a>
    <div class="top-actions">
      <input type="search" id="globalSearch" placeholder="Search vocabulary, topics..." aria-label="Search">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">&#9680;</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main id="app" tabindex="-1"></main>
  </div>

  <!-- Data -->
  <script src="data/overview.js"></script>
  <script src="data/reading.js"></script>
  <script src="data/reading-practice.js"></script>
  <script src="data/listening.js"></script>
  <script src="data/listening-practice.js"></script>
  <script src="data/writing.js"></script>
  <script src="data/writing-task2.js"></script>
  <script src="data/speaking.js"></script>
  <script src="data/vocabulary.js"></script>
  <script src="data/vocabulary-2.js"></script>
  <script src="data/grammar.js"></script>
  <script src="data/resources.js"></script>
  <!-- App -->
  <script src="js/charts.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
